<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="44" viewBox="0 0 1200 44"><defs>
<linearGradient id="s-brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="hsl(206,75%,49%)"/><stop offset="1" stop-color="hsl(331,90%,56%)"/></linearGradient>
<linearGradient id="s-trace" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="hsl(206,75%,49%)" stop-opacity="0"/><stop offset=".5" stop-color="rgb(125,211,252)"/><stop offset="1" stop-color="hsl(331,90%,56%)" stop-opacity="0"/></linearGradient>
<pattern id="s-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/></pattern>
